<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- Loading font file -->
   <link rel="preload" as="font" type="font/ttf" crossorigin="anonymous" href="./assets/fonts/space-mono.bold.ttf">
  <!-- Reset CSS file link -->
   <link rel="stylesheet" href="./styles/reset.css">
  <!-- Fonts CSS file link -->
   <link rel="stylesheet" href="./styles/fonts.css">
   <!-- Main Style file link -->
   <link rel="stylesheet" href="./styles/mainstyles.css">
   <!-- Media Query file link -->
    <link rel="stylesheet" href="./styles/mediaquery.css">

   <!-- JS script file link -->
    <script defer src="./scripts/index.js" ></script>
  <title>Frontend Mentor | Tip calculator app</title>
</head>
<body>
  <img src="./assets/images/logo.svg" alt="" aria-label="hidden" loading="lazy" width="86.66" height="53.14" class="main-img">

  <main class="main-container">

    <form method="get" class="content-container">

      <section class="bill-container">

        <div class="bill-header">
          <label for="bill" class="bill-label">Bill</label>

          <div class="bill-amount-container">
            <img src="./assets/images/icon-dollar.svg" alt="" aria-label="hidden" class="dollar-icon" loading="lazy" width="11" height="16">
            <input type="text" name="bill" id="bill" class="bill-input" placeholder="0">
          </div>

        </div>

        <div class="tip-selection-container">
          <label for="tip" class="tip-label">Select Tip %</label>

          <div class="tip-options-container">
            <button type="button" title="5%" class="tip-button">5%</button>
            <button type="button" title="10%" class="tip-button">10%</button>
            <button type="button" title="15%" class="tip-button">15%</button>
            <button type="button" title="25%" class="tip-button">25%</button>
            <button type="button" title="50%" class="tip-button">50%</button>
            <input type="text" class="custom-tip-input" id="tip" title="custom-tip-input" placeholder="Custom">
          </div>

        </div>

        <div class="people-container">

          <div class="people-container-labels">
            <label for="group" class="people-label">Number of People</label>
            <p class="error-message hide-error">Can't be zero</p>
          </div>

          <div class="people-input-container">
            <img src="./assets/images/icon-person.svg" alt="" loading="lazy" aria-label="hidden" width="15" height="18" class="people-icon">
            <input type="text" title="group" id="group" class="people-input" placeholder="0">
          </div>
        </div>

      </section>

      <section class="results-container">
        <div class="results-content">
          <div class="result-details">
            <div class="tip-amount-row">
              <p>Tip Amount <br> <span>/ person</span> </p>
              <p> <span>$</span>0.00</p>
            </div>
            <div class="total-amount-row">
              <p>Total<br> <span>/ person</span> </p>
              <p><span>$</span>0.00</p>
            </div>
          </div>
          <button type="reset" class="result-button">RESET</button>
        </div>
      </section>
    </form>

  </main>

  <footer class="footer">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/hussaindev94" target="_blank" rel="noopener noreferrer">Hussain Al-shaer</a>.
  </footer>
</body>
</html>
